<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hallway Splat XR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101014; color: #eee;
        font-family: system-ui, sans-serif; }
      #app { position: fixed; top: 12px; left: 0; right: 0; display: flex;
        flex-direction: column; align-items: center; gap: 6px;
        text-align: center; pointer-events: none; }
      h1 { font-size: 1.4rem; margin: 0; }
      p { color: #9a9aa8; margin: 0; }
      #status { font-family: monospace; color: #6fd08c; }
      canvas { width: 100vw; height: 100vh; display: block; }
      #hud { position: fixed; top: 8px; left: 8px; font-family: monospace;
        font-size: 12px; color: #ffd166; z-index: 10; }
      #spawn-panel { position: fixed; bottom: 16px; right: 16px; z-index: 10;
        background: rgba(16,16,20,0.85); border: 1px solid #333; border-radius: 8px;
        padding: 10px 12px; font-family: monospace; font-size: 12px; color: #eee;
        display: flex; flex-direction: column; gap: 6px; }
      #spawn-panel label { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
      #spawn-panel input { width: 64px; background: #1c1c24; color: #6fd08c;
        border: 1px solid #444; border-radius: 4px; padding: 2px 4px;
        font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Hallway Splat XR</h1>
      <p id="status">checking…</p>
    </div>
    <div id="spawn-panel">
      <span>Start point (moves map around you)</span>
      <label>x <input id="spawn-x" type="number" step="0.5" value="0"></label>
      <label>y <input id="spawn-y" type="number" step="0.1" value="0"></label>
      <label>z <input id="spawn-z" type="number" step="0.5" value="0"></label>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
